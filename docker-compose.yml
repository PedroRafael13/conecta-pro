services:
  # ==========================================================================
  # PostgreSQL Database
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: conecta-pro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-conecta_pro}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # SEGURANÇA: Porta NÃO exposta publicamente - acesso apenas via rede interna Docker
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-conecta_pro}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - conecta-pro-network

  # ==========================================================================
  # Redis Cache
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: conecta-pro-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    # SEGURANÇA: Porta NÃO exposta publicamente - acesso apenas via rede interna Docker
    # ports:
    #   - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - conecta-pro-network

  # ==========================================================================
  # Backend FastAPI
  # ==========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: conecta-pro-backend
    restart: unless-stopped
    environment:
      # App
      APP_NAME: ${APP_NAME:-Conecta PRO}
      DEBUG: ${DEBUG:-false}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      HOST: 0.0.0.0
      PORT: 8080
      # Database
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-conecta_pro}
      # APIs Externas
      WHATSAPP_API_ENABLED: ${WHATSAPP_API_ENABLED:-false}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      WHATSAPP_INSTANCE_ID: ${WHATSAPP_INSTANCE_ID:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GOOGLE_MAPS_ENABLED: ${GOOGLE_MAPS_ENABLED:-false}
      MAPS_DEFAULT_CENTER_LAT: ${MAPS_DEFAULT_CENTER_LAT:-}
      MAPS_DEFAULT_CENTER_LNG: ${MAPS_DEFAULT_CENTER_LNG:-}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-20}
      # Redis
      REDIS_URL: redis://redis:6379/1
      REDIS_TTL: ${REDIS_TTL:-3600}
      # Celery
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      # JWT
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-CHANGE_ME_IN_PRODUCTION_32_CHARS_MIN}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 300s  # 5 minutos para startup com VPS lento
    networks:
      - conecta-pro-network
    volumes:
      - ./logs:/app/logs
      # Credenciais (certificados digitais)
      - ./credentials:/opt/conecta-pro/credentials:ro
      # Módulos Fase 3 (externos ao backend)
      - ./01_security_lgpd:/opt/conecta-pro/security_lgpd:ro
      - ./02_health_occupational:/opt/conecta-pro/health_occupational:ro
      - ./03_government_integrations:/opt/conecta-pro/government_integrations:ro

  # ==========================================================================
  # Frontend React/Vite
  # ==========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://erp.conectamais.pro/api/v1
        VITE_APP_NAME: "Conecta PRO"
        VITE_APP_VERSION: "2.0.0"
    container_name: conecta-pro-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - conecta-pro-network
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  conecta-pro-network:
    driver: bridge
