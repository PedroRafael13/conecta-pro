# Ruff configuration for Conecta PRO Backend
target-version = "py312"
line-length = 120
exclude = ["backups"]

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = [
    "S101",   # assert usado em testes
    "S104",   # bind to 0.0.0.0
    "S105",   # hardcoded password string
    "S106",   # hardcoded password func arg
    "S108",   # hardcoded temp file
    "S110",   # try-except-pass
    "S310",   # suspicious url open
    "E501",   # line too long (ja controlado pelo formatter)
    "E741",   # ambiguous variable name
    "B008",   # Depends() em defaults - padrao FastAPI
    "B904",   # raise from dentro de except - muitos falsos positivos
    "B017",   # pytest.raises(Exception) - aceitavel em testes
    "N806",   # Mock variables uppercase - convencao de testes
    "SIM102", # collapsible-if - prejudica legibilidade em logica complexa
    "SIM103", # return-bool-condition-directly - nem sempre mais claro
    "SIM105", # contextlib.suppress - try/except/pass e mais explicito
    "SIM108", # if-else-block-instead-of-if-exp - ternarios longos sao menos legiveis
    "SIM110", # reimplemented-builtin - for+return vs any() e preferencia
    "SIM116", # if-else vs dict lookup
    "S608",   # SQL injection - protegido por validate_table_name() whitelist
    "SIM118", # key in dict vs key in dict.keys() - menor prioridade
    "UP038",  # isinstance(x, (A, B)) → isinstance(x, A | B) - removido em ruff 0.15+
]

[lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "B017", "F401", "F841", "B007", "A002", "E402"]
"alembic/**/*.py" = ["E501"]
"main.py" = ["E402"]  # Imports after app creation - padrao FastAPI
"main_production.py" = ["E402"]

[format]
quote-style = "double"
indent-style = "space"
