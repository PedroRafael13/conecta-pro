version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: conecta-pro-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: conecta_pro
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - conecta-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: conecta-pro-redis
    restart: always
    command: redis-server --requirepass redis_secret_2024
    volumes:
      - redis_data:/data
    networks:
      - conecta-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_secret_2024", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: conecta-pro-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/conecta_pro
      - REDIS_URL=redis://:redis_secret_2024@redis:6379/0
      - JWT_SECRET_KEY=qYKv60fKjmTLQlDQuDcDBL8iqOeNyPNzixbvgrVlthg
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - conecta-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: conecta-pro-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=https://erp.conectamais.pro
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - conecta-network

volumes:
  postgres_data:
  redis_data:

networks:
  conecta-network:
    driver: bridge
