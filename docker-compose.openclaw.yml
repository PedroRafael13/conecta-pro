# ===========================================================================
# OpenClaw - Autonomous Software Engineer Agent
# ===========================================================================
# Container do OpenClaw/Moltbot trabalhando 24/7 no Conecta PRO
#
# O que o OpenClaw faz:
#   - Resolve TODOs/FIXMEs automaticamente
#   - Aumenta cobertura de testes
#   - Corrige bugs
#   - Implementa features faltantes
#   - Faz code review
#   - Otimiza performance
#   - Audita segurança
#   - Gera relatórios diários
#
# Uso:
#   docker compose -f docker-compose.openclaw.yml up -d
#   docker compose -f docker-compose.openclaw.yml logs -f openclaw-agent
#   docker compose -f docker-compose.openclaw.yml down
#
# Monitoramento:
#   - Logs: /opt/conecta-pro/logs/openclaw/
#   - Relatórios: /opt/conecta-pro/reports/openclaw/
#   - Notificações: Discord/Slack (via webhook)
# ===========================================================================

services:
  # ==========================================================================
  # OpenClaw Agent - Autonomous Software Engineer
  # ==========================================================================
  openclaw-agent:
    # NOTA: Substituir pela imagem oficial quando disponível
    # Por enquanto, usamos uma imagem customizada baseada em Python com ferramentas
    image: python:3.12-slim
    container_name: openclaw-agent
    restart: unless-stopped

    # Comando customizado: loop infinito executando tarefas
    command: >
      sh -c "
        echo '🤖 OpenClaw Agent iniciando...';
        pip install --no-cache-dir -q anthropic openai httpx pydantic python-dotenv gitpython pytest pytest-cov ruff black isort bandit safety;
        echo '✅ Dependências instaladas';
        python3 /app/scripts/openclaw/main-loop.py;
      "

    environment:
      # =========================
      # OpenClaw Configuration
      # =========================
      OPENCLAW_ENABLED: "true"
      OPENCLAW_MODE: "autonomous"  # autonomous | supervised
      OPENCLAW_INTERVAL: ${OPENCLAW_INTERVAL:-3600}  # segundos (1h)
      OPENCLAW_TARGET_ENV: "staging"
      OPENCLAW_WORK_DIR: "/workspace"

      # =========================
      # AI Provider (Anthropic/OpenAI)
      # =========================
      # Recomendado: Claude 3.5 Sonnet (melhor para coding)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}

      # Alternativa: OpenAI (se preferir GPT-4)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}

      # Configurações do LLM
      LLM_MAX_TOKENS: 4096
      LLM_TEMPERATURE: 0.3  # Baixa temperatura = mais determinístico

      # =========================
      # Git Configuration
      # =========================
      GIT_USER_NAME: "OpenClaw Agent"
      GIT_USER_EMAIL: "openclaw@conectapro.local"
      GIT_BRANCH: "staging"
      GIT_AUTO_PUSH: "true"

      # =========================
      # Staging Environment Access
      # =========================
      STAGING_BACKEND_URL: "http://backend-staging:8081"
      STAGING_FRONTEND_URL: "http://frontend-staging:3000"
      STAGING_DB_HOST: "postgres-staging"
      STAGING_DB_PORT: "5432"
      STAGING_DB_NAME: ${POSTGRES_DB_STAGING:-conecta_pro_staging}
      STAGING_DB_USER: ${POSTGRES_USER:-postgres}
      STAGING_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

      # =========================
      # Quality Gates (Mínimos)
      # =========================
      MIN_TEST_COVERAGE: ${OPENCLAW_MIN_COVERAGE:-70}
      MIN_LINT_SCORE: 8.0
      MAX_COMPLEXITY: 10
      FAIL_ON_SECURITY_HIGH: "true"

      # =========================
      # Notificações
      # =========================
      NOTIFY_ON: ${OPENCLAW_NOTIFY_ON:-success,fail,milestone,critical}
      DISCORD_WEBHOOK: ${DISCORD_WEBHOOK:-}
      SLACK_WEBHOOK: ${SLACK_WEBHOOK:-}

      # =========================
      # Task Priorities
      # =========================
      PRIORITIES: "critical,security,tests,bugs,todos,features,refactor"
      MAX_TASKS_PER_CYCLE: 8
      MAX_TIME_PER_TASK: 1800  # 30min

      # =========================
      # Safety Limits
      # =========================
      MAX_FILES_PER_COMMIT: 20
      MAX_LINES_PER_COMMIT: 500
      REQUIRE_APPROVAL_FOR: "breaking_changes,migrations,dependencies"

      # =========================
      # Logging
      # =========================
      LOG_LEVEL: INFO
      LOG_FILE: "/workspace/logs/openclaw/agent.log"

    volumes:
      # Código fonte (read-write) - OpenClaw precisa modificar código
      - ./:/workspace:rw

      # Git config (para commits)
      - ./config/openclaw/gitconfig:/root/.gitconfig:ro

      # Logs OpenClaw
      - ./logs/openclaw:/workspace/logs/openclaw:rw

      # Relatórios
      - ./reports/openclaw:/workspace/reports/openclaw:rw

      # Scripts OpenClaw
      - ./scripts/openclaw:/app/scripts/openclaw:ro

      # Backlog de tarefas
      - ./scripts/openclaw/backlog.json:/app/backlog.json:rw

      # Missão e objetivos
      - ./OPENCLAW_MISSION.md:/app/OPENCLAW_MISSION.md:ro

      # Docker socket (para controlar containers staging)
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - conecta-staging-network
      - conecta-pro-network  # Acesso read-only à produção para monitoring

    depends_on:
      - backend-staging
      - postgres-staging
      - redis-staging

    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/openclaw-heartbeat && test $(( $(date +%s) - $(stat -c %Y /tmp/openclaw-heartbeat) )) -lt 300"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

    # Recursos limitados (ajustar conforme VPS)
    deploy:
      resources:
        limits:
          cpus: '2.0'      # 2 cores
          memory: 4096M    # 4GB RAM
        reservations:
          cpus: '1.0'      # 1 core mínimo
          memory: 2048M    # 2GB RAM mínimo

  # ==========================================================================
  # OpenClaw Dashboard (Opcional - Monitoring Web UI)
  # ==========================================================================
  openclaw-dashboard:
    image: nginx:alpine
    container_name: openclaw-dashboard
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      # Arquivos estáticos do dashboard
      - ./scripts/openclaw/dashboard:/usr/share/nginx/html:ro
      # Relatórios (JSON para visualização)
      - ./reports/openclaw:/usr/share/nginx/html/reports:ro
      # Config Nginx customizada
      - ./config/openclaw/nginx-dashboard.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - conecta-staging-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  conecta-staging-network:
    external: true
  conecta-pro-network:
    external: true

# ===========================================================================
# NOTAS DE USO
# ===========================================================================
#
# 1. PRIMEIRA VEZ (Setup inicial):
#
#    # Criar networks
#    docker network create conecta-staging-network
#    docker network create conecta-pro-network
#
#    # Configurar variáveis de ambiente
#    cp .env.example .env
#    # Editar .env e adicionar:
#    #   ANTHROPIC_API_KEY=sk-ant-...
#    #   DISCORD_WEBHOOK=https://discord.com/api/webhooks/...
#
#    # Subir ambiente staging primeiro
#    docker compose -f docker-compose.staging.yml up -d
#
#    # Aguardar staging ficar healthy (~2min)
#    docker compose -f docker-compose.staging.yml ps
#
#    # Subir OpenClaw
#    docker compose -f docker-compose.openclaw.yml up -d
#
# 2. MONITORAR EM TEMPO REAL:
#
#    # Logs do agente
#    docker compose -f docker-compose.openclaw.yml logs -f openclaw-agent
#
#    # Dashboard web
#    open http://localhost:8082
#
#    # Relatórios JSON
#    cat reports/openclaw/daily-report-$(date +%Y-%m-%d).json | jq
#
# 3. PARAR/REINICIAR:
#
#    # Parar tudo
#    docker compose -f docker-compose.openclaw.yml down
#    docker compose -f docker-compose.staging.yml down
#
#    # Reiniciar só o agente (após mudanças)
#    docker compose -f docker-compose.openclaw.yml restart openclaw-agent
#
# 4. VERIFICAR PROGRESSO:
#
#    # Últimos commits do OpenClaw
#    git log --author="OpenClaw" --oneline -20
#
#    # Estatísticas
#    python3 scripts/openclaw/stats.py
#
#    # Cobertura atual
#    cat reports/openclaw/coverage-latest.json | jq '.total_coverage'
#
# 5. TROUBLESHOOTING:
#
#    # Agent não está commitando?
#    docker exec openclaw-agent git config --list
#
#    # Agent travou?
#    docker restart openclaw-agent
#
#    # Verificar health
#    docker inspect openclaw-agent --format='{{.State.Health.Status}}'
#
#    # Ver CPU/RAM usado
#    docker stats openclaw-agent
#
# ===========================================================================
