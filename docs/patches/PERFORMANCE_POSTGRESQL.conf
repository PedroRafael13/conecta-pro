# =============================================================================
# CONECTA PRO - PostgreSQL Performance Configuration
# =============================================================================
# Data: 2026-02-05
# Versão: 1.0
# Propósito: Otimizar PostgreSQL para carga de ERP enterprise
#
# Aplicação: Copiar para postgresql.conf ou usar via docker-compose command
# =============================================================================

# -----------------------------------------------------------------------------
# MEMÓRIA
# -----------------------------------------------------------------------------

# Memória compartilhada para cache de dados (25% da RAM total recomendado)
# Para servidor com 4GB: 512MB
# Para servidor com 8GB: 1GB
# Para servidor com 16GB: 2GB
shared_buffers = 512MB

# Memória efetiva disponível para o PostgreSQL (50% da RAM total)
# Usado pelo query planner para estimar custos
effective_cache_size = 1536MB

# Memória por operação de ordenação/hash (cuidado com conexões simultâneas)
# work_mem * max_connections não deve exceder RAM disponível
# Valor conservador para ERP com muitas conexões
work_mem = 4MB

# Memória para operações de manutenção (VACUUM, CREATE INDEX, etc.)
maintenance_work_mem = 128MB

# -----------------------------------------------------------------------------
# CONEXÕES
# -----------------------------------------------------------------------------

# Máximo de conexões simultâneas
# Ajustar conforme pool de conexões da aplicação
# FastAPI + async: 200 conexões permite bom paralelismo
max_connections = 200

# -----------------------------------------------------------------------------
# WAL (Write-Ahead Logging)
# -----------------------------------------------------------------------------

# Buffers para WAL
wal_buffers = 16MB

# Tamanho mínimo de WAL mantido
min_wal_size = 1GB

# Tamanho máximo de WAL antes de forçar checkpoint
max_wal_size = 4GB

# -----------------------------------------------------------------------------
# CHECKPOINTS
# -----------------------------------------------------------------------------

# Checkpoint a cada 5 minutos ou quando atingir max_wal_size
checkpoint_timeout = 5min

# Espalhar checkpoint ao longo do tempo para evitar picos de I/O
checkpoint_completion_target = 0.9

# -----------------------------------------------------------------------------
# QUERY PLANNER
# -----------------------------------------------------------------------------

# Custo de acesso aleatório a páginas (1.1 para SSD, 4.0 para HDD)
random_page_cost = 1.1

# Número de operações de I/O simultâneas que o disco pode fazer
# SSD: 200, HDD: 2
effective_io_concurrency = 200

# Estatísticas padrão para análise de colunas (aumentar para tabelas grandes)
default_statistics_target = 100

# -----------------------------------------------------------------------------
# LOGGING E MONITORAMENTO
# -----------------------------------------------------------------------------

# Logar queries que demoram mais que X milissegundos
# 1000ms = 1 segundo (ajustar conforme necessidade)
log_min_duration_statement = 1000

# Formato do log
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# Tipo de log
log_statement = 'none'  # none, ddl, mod, all (cuidado com 'all' em produção)

# Logar checkpoints
log_checkpoints = on

# Logar conexões (útil para debugging, pode gerar muito log)
log_connections = off

# Logar desconexões
log_disconnections = off

# Logar esperas por locks
log_lock_waits = on

# Logar queries lentas automaticamente
log_autovacuum_min_duration = 1000

# -----------------------------------------------------------------------------
# AUTOVACUUM
# -----------------------------------------------------------------------------

# Habilitar autovacuum (crítico para performance)
autovacuum = on

# Analisar tabelas após 10% das linhas mudarem
autovacuum_analyze_scale_factor = 0.1

# Vacuum após 20% das linhas mudarem
autovacuum_vacuum_scale_factor = 0.2

# Workers para autovacuum
autovacuum_max_workers = 3

# -----------------------------------------------------------------------------
# LOCALE E FORMATO
# -----------------------------------------------------------------------------

# Fuso horário padrão
timezone = 'America/Sao_Paulo'

# Formato de data
datestyle = 'iso, dmy'

# -----------------------------------------------------------------------------
# NOTAS DE APLICAÇÃO
# -----------------------------------------------------------------------------
#
# 1. Estas configurações são para servidor com ~4GB RAM disponível
#    Ajustar shared_buffers e effective_cache_size conforme hardware real
#
# 2. Para aplicar em Docker (docker-compose.yml):
#    command: >
#      postgres
#      -c shared_buffers=512MB
#      -c effective_cache_size=1536MB
#      -c work_mem=4MB
#      ...
#
# 3. Para aplicar no postgresql.conf:
#    sudo cp PERFORMANCE_POSTGRESQL.conf /etc/postgresql/16/main/postgresql.conf
#    sudo systemctl restart postgresql
#
# 4. Validar após alteração:
#    SHOW shared_buffers;
#    SHOW effective_cache_size;
#    SHOW max_connections;
#
# 5. Monitorar:
#    - Cache hit ratio: SELECT sum(heap_blks_hit) / (sum(heap_blks_hit) + sum(heap_blks_read)) FROM pg_statio_user_tables;
#    - Queries lentas: SELECT * FROM pg_stat_statements ORDER BY mean_exec_time DESC LIMIT 10;
#
# =============================================================================
