# PATCH 05: Configurações de Segurança Docker
# Data: 2026-02-05
# Severidade: ALTO
#
# Melhorias de segurança para docker-compose.yml
# - PostgreSQL não exposto externamente
# - Redis com senha obrigatória
# - Networks isoladas
# - Health checks melhorados

version: '3.8'

services:
  # ==========================================================================
  # PostgreSQL Database (Seguro)
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: conecta-pro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-conecta_pro}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # SEGURANÇA: Porta NÃO exposta publicamente - acesso apenas via rede interna Docker
    # Se necessário acesso externo para debugging, use apenas localhost:
    # ports:
    #   - "127.0.0.1:5432:5432"  # Bind apenas em localhost, nunca 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-conecta_pro}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - conecta-pro-network
    # SEGURANÇA: Usuário não-root
    user: "999:999"
    # SEGURANÇA: Capabilities mínimas
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    # SEGURANÇA: Read-only filesystem onde possível
    read_only: false  # PostgreSQL precisa de escrita em /var/lib/postgresql
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    # SEGURANÇA: Limites de recursos
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    security_opt:
      - no-new-privileges:true

  # ==========================================================================
  # Redis Cache (Seguro)
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: conecta-pro-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-}
      --bind 0.0.0.0
      --protected-mode yes
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    # SEGURANÇA: Porta NÃO exposta publicamente
    # ports:
    #   - "127.0.0.1:6379:6379"  # Descomente apenas para debugging local
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - conecta-pro-network
    # SEGURANÇA: Usuário não-root
    user: "999:999"
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    security_opt:
      - no-new-privileges:true

  # ==========================================================================
  # Backend FastAPI
  # ==========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: conecta-pro-backend
    restart: unless-stopped
    environment:
      # App
      APP_NAME: ${APP_NAME:-Conecta PRO}
      DEBUG: ${DEBUG:-false}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      HOST: 0.0.0.0
      PORT: 8080
      # Database
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-conecta_pro}
      # Redis (com senha)
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      REDIS_TTL: ${REDIS_TTL:-3600}
      # Celery (com senha)
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
      # JWT (deve ser alterado em produção!)
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      # CORS (whitelist específica em produção)
      CORS_ORIGINS: ${CORS_ORIGINS}
      # Outras configurações...
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 300s
    networks:
      - conecta-pro-network
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./credentials:/opt/conecta-pro/credentials:ro
      - ./reports:/opt/conecta-pro/reports
    # SEGURANÇA: Limites de recursos
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 1G
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  # ==========================================================================
  # Frontend Next.js
  # ==========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: conecta-pro-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
    networks:
      - conecta-pro-network
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ==========================================================================
  # Nginx Reverse Proxy + SSL
  # ==========================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: conecta-pro-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/ssl-params.conf:/etc/nginx/ssl-params.conf:ro
      - ./config/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - conecta-pro-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE  # Necessário para bind em portas < 1024

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  conecta-pro-network:
    driver: bridge
    # SEGURANÇA: Isolamento de rede
    internal: false  # Defina como true se não precisar de acesso externo
    ipam:
      config:
        - subnet: 172.20.0.0/16
