<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conecta PRO — Multi-Agent Dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Oxanium:wght@300;400;500;600;700&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --bg-deep: #07090d;
  --bg-panel: #0c1017;
  --bg-card: #111827;
  --bg-elevated: #1a2332;
  --border: #1e293b;
  --border-bright: #334155;
  --text: #e2e8f0;
  --text-dim: #64748b;
  --text-muted: #475569;
  --accent: #3b82f6;
  --accent-glow: rgba(59, 130, 246, 0.15);
  --green: #22c55e;
  --green-dim: rgba(34, 197, 94, 0.15);
  --amber: #f59e0b;
  --amber-dim: rgba(245, 158, 11, 0.12);
  --red: #ef4444;
  --red-dim: rgba(239, 68, 68, 0.12);
  --cyan: #06b6d4;
  --font-display: 'Oxanium', sans-serif;
  --font-mono: 'JetBrains Mono', 'Consolas', monospace;
}

html { font-size: 14px; }
body {
  font-family: var(--font-mono);
  background: var(--bg-deep);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Scanline overlay */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.03) 2px,
    rgba(0,0,0,0.03) 4px
  );
}

/* ===== HEADER ===== */
.header {
  background: linear-gradient(180deg, #0f1520 0%, var(--bg-deep) 100%);
  border-bottom: 1px solid var(--border);
  padding: 0.75rem 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 0.75rem;
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.logo {
  font-family: var(--font-display);
  font-size: 1.15rem;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: var(--text);
}
.logo span { color: var(--accent); }

.header-status {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.75rem;
  color: var(--text-dim);
}

.pulse-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--green);
  animation: pulse 2s ease-in-out infinite;
}
.pulse-dot.warn { background: var(--amber); }
.pulse-dot.error { background: var(--red); animation: pulse-fast 1s ease-in-out infinite; }

@keyframes pulse {
  0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(34,197,94,0.4); }
  50% { opacity: 0.6; box-shadow: 0 0 0 6px rgba(34,197,94,0); }
}
@keyframes pulse-fast {
  0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(239,68,68,0.5); }
  50% { opacity: 0.5; box-shadow: 0 0 0 8px rgba(239,68,68,0); }
}

.header-right {
  display: flex;
  align-items: center;
  gap: 1rem;
  font-size: 0.75rem;
  color: var(--text-dim);
}

.container-summary {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 0.3rem 0.7rem;
  font-weight: 500;
}
.container-summary .num { color: var(--green); font-weight: 700; }

.refresh-badge {
  display: flex;
  align-items: center;
  gap: 0.35rem;
}
.refresh-spin {
  width: 12px; height: 12px;
  border: 1.5px solid var(--text-muted);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 1.5s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== MAIN LAYOUT ===== */
.main {
  max-width: 1600px;
  margin: 0 auto;
  padding: 1rem 1.5rem 3rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

/* ===== METRICS ROW ===== */
.metrics-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0.75rem;
}

.metric-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1rem 1.1rem;
  position: relative;
  overflow: hidden;
  transition: border-color 0.3s;
}
.metric-card:hover { border-color: var(--border-bright); }
.metric-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--accent);
  opacity: 0.5;
}

.metric-label {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--text-dim);
  margin-bottom: 0.5rem;
}

.metric-value {
  font-family: var(--font-display);
  font-size: 2rem;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 0.6rem;
}

.metric-sub {
  font-size: 0.7rem;
  color: var(--text-muted);
}

.metric-bar {
  height: 4px;
  background: var(--bg-elevated);
  border-radius: 2px;
  margin-top: 0.6rem;
  overflow: hidden;
}
.metric-bar-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.8s ease, background 0.5s;
}

/* ===== SPLIT LAYOUT ===== */
.split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.75rem;
}

/* ===== PANELS ===== */
.panel {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.7rem 1rem;
  border-bottom: 1px solid var(--border);
  background: rgba(255,255,255,0.015);
}

.panel-title {
  font-family: var(--font-display);
  font-size: 0.8rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-dim);
}

.panel-badge {
  font-size: 0.65rem;
  padding: 0.15rem 0.5rem;
  border-radius: 10px;
  background: var(--bg-elevated);
  color: var(--text-dim);
  border: 1px solid var(--border);
}

.panel-body { padding: 0.75rem 1rem; }

/* ===== CONTAINER GRID ===== */
.container-groups { display: flex; flex-direction: column; gap: 0.75rem; }

.group-label {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-muted);
  padding-bottom: 0.25rem;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}

.container-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 0.4rem;
}

.ct {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.45rem 0.6rem;
  border-radius: 5px;
  background: var(--bg-elevated);
  border: 1px solid transparent;
  transition: all 0.25s;
  font-size: 0.72rem;
}
.ct:hover { border-color: var(--border-bright); background: rgba(255,255,255,0.04); }

.ct-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
  transition: background 0.5s;
}
.ct-dot.healthy { background: var(--green); box-shadow: 0 0 6px rgba(34,197,94,0.4); }
.ct-dot.running { background: var(--amber); box-shadow: 0 0 6px rgba(245,158,11,0.3); }
.ct-dot.unhealthy { background: var(--red); box-shadow: 0 0 6px rgba(239,68,68,0.4); }
.ct-dot.stopped { background: #475569; }

.ct-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text);
}

/* ===== TABLE ===== */
.tbl {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.72rem;
}
.tbl th {
  text-align: left;
  font-weight: 500;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  font-size: 0.62rem;
  padding: 0.5rem 0.6rem;
  border-bottom: 1px solid var(--border);
}
.tbl td {
  padding: 0.5rem 0.6rem;
  border-bottom: 1px solid rgba(255,255,255,0.03);
  vertical-align: top;
}
.tbl tr:hover td { background: rgba(255,255,255,0.015); }

.sev-badge {
  display: inline-block;
  padding: 0.1rem 0.45rem;
  border-radius: 3px;
  font-size: 0.6rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.sev-critical { background: var(--red-dim); color: var(--red); border: 1px solid rgba(239,68,68,0.25); }
.sev-warning { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(245,158,11,0.2); }
.sev-info { background: var(--accent-glow); color: var(--accent); border: 1px solid rgba(59,130,246,0.2); }

.status-badge {
  display: inline-block;
  padding: 0.1rem 0.4rem;
  border-radius: 3px;
  font-size: 0.6rem;
}
.status-resolved { background: var(--green-dim); color: var(--green); }
.status-acting { background: var(--amber-dim); color: var(--amber); }
.status-failed { background: var(--red-dim); color: var(--red); }

/* ===== PATTERNS ===== */
.patterns-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 0.6rem;
}

.pattern-card {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 0.8rem 1rem;
}

.pattern-name {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 0.82rem;
  margin-bottom: 0.3rem;
  color: var(--text);
}

.pattern-desc {
  font-size: 0.7rem;
  color: var(--text-dim);
  margin-bottom: 0.6rem;
  line-height: 1.4;
}

.confidence-row {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 0.4rem;
}
.confidence-bar {
  flex: 1;
  height: 6px;
  background: var(--bg-card);
  border-radius: 3px;
  overflow: hidden;
}
.confidence-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 1s ease;
}
.confidence-val {
  font-size: 0.72rem;
  font-weight: 600;
  min-width: 38px;
  text-align: right;
}

.pattern-meta {
  display: flex;
  gap: 1rem;
  font-size: 0.62rem;
  color: var(--text-muted);
}

/* ===== UPTIME CHART ===== */
.uptime-chart { display: flex; flex-direction: column; gap: 0.5rem; }

.uptime-row {
  display: flex;
  align-items: center;
  gap: 0.6rem;
}
.uptime-label {
  width: 70px;
  font-size: 0.68rem;
  color: var(--text-dim);
  text-align: right;
  flex-shrink: 0;
}
.uptime-bars {
  flex: 1;
  display: flex;
  gap: 2px;
  height: 22px;
}
.uptime-seg {
  flex: 1;
  border-radius: 2px;
  transition: background 0.3s;
  position: relative;
}
.uptime-seg.up { background: var(--green); opacity: 0.7; }
.uptime-seg.up:hover { opacity: 1; }
.uptime-seg.down { background: var(--red); opacity: 0.8; }
.uptime-seg.partial { background: var(--amber); opacity: 0.7; }

.uptime-hours {
  display: flex;
  gap: 2px;
  margin-left: 76px;
}
.uptime-hours span {
  flex: 1;
  text-align: center;
  font-size: 0.55rem;
  color: var(--text-muted);
}

/* ===== SCHEDULED ===== */
.sched-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 0.4rem;
}
.sched-item {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5rem 0.7rem;
  background: var(--bg-elevated);
  border-radius: 5px;
  font-size: 0.7rem;
}
.sched-icon {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--cyan);
  flex-shrink: 0;
}
.sched-name { color: var(--text); flex: 1; }
.sched-time { color: var(--text-muted); font-size: 0.62rem; }

/* ===== LOADING / ERROR ===== */
.loading-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg-deep);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 200;
  transition: opacity 0.5s;
}
.loading-overlay.hidden { opacity: 0; pointer-events: none; }

.loading-spinner {
  width: 40px; height: 40px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin-bottom: 1rem;
}
.loading-text {
  font-family: var(--font-display);
  color: var(--text-dim);
  font-size: 0.85rem;
}

.error-banner {
  background: var(--red-dim);
  border: 1px solid rgba(239,68,68,0.3);
  border-radius: 6px;
  padding: 0.6rem 1rem;
  font-size: 0.75rem;
  color: var(--red);
  display: none;
  align-items: center;
  gap: 0.5rem;
}
.error-banner.show { display: flex; }

/* ===== RESPONSIVE ===== */
@media (max-width: 1100px) {
  .split { grid-template-columns: 1fr; }
}
@media (max-width: 768px) {
  html { font-size: 13px; }
  .header { padding: 0.5rem 1rem; }
  .main { padding: 0.75rem; }
  .metrics-row { grid-template-columns: repeat(2, 1fr); }
  .metric-value { font-size: 1.5rem; }
  .container-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 480px) {
  .metrics-row { grid-template-columns: 1fr; }
}

/* ===== ANIMATION ===== */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.fade-up { animation: fadeUp 0.4s ease forwards; }
.delay-1 { animation-delay: 0.05s; opacity: 0; }
.delay-2 { animation-delay: 0.1s; opacity: 0; }
.delay-3 { animation-delay: 0.15s; opacity: 0; }
.delay-4 { animation-delay: 0.2s; opacity: 0; }
</style>
</head>
<body>

<div class="loading-overlay" id="loader">
  <div class="loading-spinner"></div>
  <div class="loading-text">Carregando dados...</div>
</div>

<header class="header">
  <div class="header-left">
    <div class="logo">CONECTA <span>PRO</span> &mdash; Multi-Agent Dashboard</div>
    <div class="header-status">
      <div class="pulse-dot" id="statusDot"></div>
      <span id="statusText">Conectando...</span>
    </div>
  </div>
  <div class="header-right">
    <div class="container-summary" id="containerSummary">--/-- containers</div>
    <div id="lastUpdate">--</div>
    <div class="refresh-badge">
      <div class="refresh-spin" id="refreshSpin"></div>
      <span>30s</span>
    </div>
  </div>
</header>

<main class="main">
  <div class="error-banner" id="errorBanner">Falha ao carregar dados. Tentando novamente...</div>

  <!-- METRICS -->
  <section class="metrics-row" id="metricsRow"></section>

  <!-- CONTAINERS + INTERVENTIONS -->
  <section class="split">
    <div class="panel fade-up delay-2">
      <div class="panel-header">
        <div class="panel-title">Containers</div>
        <div class="panel-badge" id="containerBadge">--</div>
      </div>
      <div class="panel-body" id="containerPanel"></div>
    </div>
    <div class="panel fade-up delay-3">
      <div class="panel-header">
        <div class="panel-title">Intervenções OpenClaw</div>
        <div class="panel-badge" id="interventionBadge">--</div>
      </div>
      <div class="panel-body" style="padding:0;">
        <div style="overflow-x:auto;" id="interventionPanel"></div>
      </div>
    </div>
  </section>

  <!-- PATTERNS -->
  <section class="panel fade-up delay-3">
    <div class="panel-header">
      <div class="panel-title">Padrões Aprendidos</div>
      <div class="panel-badge" id="patternBadge">--</div>
    </div>
    <div class="panel-body" id="patternPanel"></div>
  </section>

  <!-- UPTIME + SCHEDULED -->
  <section class="split">
    <div class="panel fade-up delay-4">
      <div class="panel-header">
        <div class="panel-title">Uptime 24h</div>
        <div class="panel-badge">Core Services</div>
      </div>
      <div class="panel-body" id="uptimePanel"></div>
    </div>
    <div class="panel fade-up delay-4">
      <div class="panel-header">
        <div class="panel-title">Ações Agendadas</div>
        <div class="panel-badge" id="schedBadge">--</div>
      </div>
      <div class="panel-body" id="schedPanel"></div>
    </div>
  </section>
</main>

<script>
const BRT_OFFSET = -4;

function fmtTime(iso) {
  if (!iso) return '--';
  const d = new Date(iso);
  const brt = new Date(d.getTime() + BRT_OFFSET * 3600000);
  const hh = String(brt.getUTCHours()).padStart(2,'0');
  const mm = String(brt.getUTCMinutes()).padStart(2,'0');
  const dd = String(brt.getUTCDate()).padStart(2,'0');
  const mo = String(brt.getUTCMonth()+1).padStart(2,'0');
  return `${hh}:${mm} ${dd}/${mo}`;
}

function barColor(pct, thresholds) {
  const [w, c] = thresholds || [70, 90];
  if (pct >= c) return 'var(--red)';
  if (pct >= w) return 'var(--amber)';
  return 'var(--green)';
}

function metricCard(label, value, unit, pct, sub, thresholds) {
  const color = barColor(pct, thresholds);
  return `<div class="metric-card fade-up delay-1">
    <div class="metric-label">${label}</div>
    <div class="metric-value" style="color:${color}">${value}<span style="font-size:0.9rem;color:var(--text-dim);margin-left:3px">${unit}</span></div>
    <div class="metric-bar"><div class="metric-bar-fill" style="width:${Math.min(pct,100)}%;background:${color}"></div></div>
    <div class="metric-sub">${sub}</div>
  </div>`;
}

function classifyContainer(name) {
  if (/backend|postgres(?!-ex)|redis(?!-ex)|nginx/.test(name) && !/staging|celery|flower|exporter/.test(name))
    return 'core';
  if (/celery|flower/.test(name)) return 'workers';
  if (/prometheus|grafana|loki|promtail|alertmanager|exporter/.test(name)) return 'monitoring';
  if (/staging/.test(name)) return 'staging';
  return 'other';
}

function shortName(name) {
  return name
    .replace(/^[0-9a-f]{12}_/, '')
    .replace('conecta-pro-', '')
    .replace('erp-', '');
}

function render(data) {
  const m = data.metrics;

  // Header
  const healthy = data.containers.filter(c => c.health === 'healthy' || c.health === 'running').length;
  const total = data.containers.length;
  document.getElementById('containerSummary').innerHTML =
    `<span class="num">${healthy}</span>/${total} containers`;
  document.getElementById('lastUpdate').textContent = fmtTime(data.generated_at);

  const allOk = healthy >= total - 2;
  const dot = document.getElementById('statusDot');
  const stxt = document.getElementById('statusText');
  dot.className = 'pulse-dot' + (allOk ? '' : healthy > total/2 ? ' warn' : ' error');
  stxt.textContent = allOk ? 'Operacional' : `${total - healthy} degradados`;

  // Metrics
  const cpuPct = Math.round(m.load_5m / m.cpu_cores * 100);
  document.getElementById('metricsRow').innerHTML =
    metricCard('CPU Load', m.load_5m.toFixed(1), `/ ${m.cpu_cores}`, cpuPct,
      `1m: ${m.load_1m.toFixed(1)} · 15m: ${m.load_15m.toFixed(1)}`, [60,85]) +
    metricCard('Memória', m.mem_percent.toFixed(0), '%', m.mem_percent,
      `${m.mem_used_gb.toFixed(1)} / ${m.mem_total_gb.toFixed(1)} GB`, [80,90]) +
    metricCard('Disco', m.disk_percent, '%', m.disk_percent,
      `${m.disk_used_gb} / ${m.disk_total_gb} GB`, [70,85]) +
    metricCard('Fila Celery', data.celery_queue_length, 'tasks',
      Math.min(data.celery_queue_length, 100),
      data.celery_queue_length > 50 ? 'Acima do normal' : 'Normal', [50,100]);

  // Containers
  const groups = { core: [], workers: [], monitoring: [], staging: [], other: [] };
  const labels = { core: 'Infraestrutura Core', workers: 'Celery Workers', monitoring: 'Monitoramento', staging: 'Staging', other: 'Outros' };
  data.containers.forEach(c => {
    const g = classifyContainer(c.name);
    groups[g].push(c);
  });

  let chtml = '<div class="container-groups">';
  for (const [key, arr] of Object.entries(groups)) {
    if (!arr.length) continue;
    chtml += `<div><div class="group-label">${labels[key]} (${arr.length})</div>
      <div class="container-grid">
        ${arr.map(c => `<div class="ct">
          <div class="ct-dot ${c.health}"></div>
          <div class="ct-name" title="${c.name}">${shortName(c.name)}</div>
        </div>`).join('')}
      </div></div>`;
  }
  chtml += '</div>';
  document.getElementById('containerPanel').innerHTML = chtml;
  document.getElementById('containerBadge').textContent = `${total} total`;

  // Interventions
  const intv = data.interventions || [];
  document.getElementById('interventionBadge').textContent = `${intv.length} registros`;
  if (intv.length === 0) {
    document.getElementById('interventionPanel').innerHTML =
      '<div style="padding:2rem;text-align:center;color:var(--text-muted);font-size:0.75rem;">Nenhuma intervenção registrada</div>';
  } else {
    let thtml = `<table class="tbl"><thead><tr>
      <th>Hora</th><th>Alerta</th><th>Sev.</th><th>Status</th><th>Resolução</th>
    </tr></thead><tbody>`;
    intv.slice(0, 10).forEach(i => {
      const sevCls = i.severity === 'critical' ? 'sev-critical' : i.severity === 'warning' ? 'sev-warning' : 'sev-info';
      const stCls = i.status === 'resolved' ? 'status-resolved' : i.status === 'acting' ? 'status-acting' : 'status-failed';
      thtml += `<tr>
        <td style="white-space:nowrap;color:var(--text-dim)">${fmtTime(i.created_at)}</td>
        <td style="font-weight:500">${i.alert_name}</td>
        <td><span class="sev-badge ${sevCls}">${i.severity}</span></td>
        <td><span class="status-badge ${stCls}">${i.status}</span></td>
        <td style="color:var(--text-dim);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${i.resolution || '--'}</td>
      </tr>`;
    });
    thtml += '</tbody></table>';
    document.getElementById('interventionPanel').innerHTML = thtml;
  }

  // Patterns
  const pats = data.patterns || [];
  document.getElementById('patternBadge').textContent = `${pats.length} ativos`;
  if (pats.length === 0) {
    document.getElementById('patternPanel').innerHTML =
      '<div style="text-align:center;color:var(--text-muted);font-size:0.75rem;padding:1.5rem;">Nenhum padrão aprendido ainda. O sistema precisa de mais tempo de operação.</div>';
  } else {
    document.getElementById('patternPanel').innerHTML = '<div class="patterns-grid">' +
      pats.map(p => {
        const conf = p.confidence_score || 0;
        const confColor = conf >= 85 ? 'var(--green)' : conf >= 60 ? 'var(--amber)' : 'var(--text-muted)';
        return `<div class="pattern-card">
          <div class="pattern-name">${p.alert_name}</div>
          <div class="pattern-desc">${p.description || '--'}</div>
          <div class="confidence-row">
            <div class="confidence-bar"><div class="confidence-fill" style="width:${conf}%;background:${confColor}"></div></div>
            <div class="confidence-val" style="color:${confColor}">${conf.toFixed(0)}%</div>
          </div>
          <div class="pattern-meta">
            <span>Prevenções: ${p.prevention_count || 0}</span>
            <span>Última: ${p.last_prevented_at ? fmtTime(p.last_prevented_at) : 'nunca'}</span>
          </div>
        </div>`;
      }).join('') + '</div>';
  }

  // Uptime
  const up = data.uptime_history || [];
  const services = ['backend', 'postgres', 'redis'];
  const serviceLabels = { backend: 'Backend', postgres: 'PostgreSQL', redis: 'Redis' };
  let uhtml = '<div class="uptime-chart">';
  services.forEach(svc => {
    uhtml += `<div class="uptime-row">
      <div class="uptime-label">${serviceLabels[svc]}</div>
      <div class="uptime-bars">
        ${up.map(h => {
          const v = h[svc] || 0;
          const cls = v >= 99 ? 'up' : v >= 50 ? 'partial' : 'down';
          return `<div class="uptime-seg ${cls}" title="${h.hour}: ${v}%"></div>`;
        }).join('')}
      </div>
    </div>`;
  });
  // Hour labels (every 4th)
  uhtml += '<div class="uptime-hours">' +
    up.map((h, i) => `<span>${i % 4 === 0 ? h.hour.replace(':00','h') : ''}</span>`).join('') +
    '</div></div>';
  document.getElementById('uptimePanel').innerHTML = uhtml;

  // Scheduled
  const sched = data.scheduled_actions || [];
  document.getElementById('schedBadge').textContent = `${sched.length} tarefas`;
  document.getElementById('schedPanel').innerHTML = '<div class="sched-grid">' +
    sched.map(s => `<div class="sched-item">
      <div class="sched-icon"></div>
      <div class="sched-name">${s.name}</div>
      <div class="sched-time">${s.schedule}</div>
    </div>`).join('') + '</div>';
}

let failCount = 0;

async function fetchData() {
  try {
    const r = await fetch('/agents/dashboard/dashboard_data.json?t=' + Date.now());
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    render(data);
    failCount = 0;
    document.getElementById('errorBanner').classList.remove('show');
    document.getElementById('loader').classList.add('hidden');
  } catch (e) {
    failCount++;
    if (failCount > 1) {
      document.getElementById('errorBanner').classList.add('show');
    }
    document.getElementById('loader').classList.add('hidden');
  }
}

fetchData();
setInterval(fetchData, 30000);
</script>
</body>
</html>
