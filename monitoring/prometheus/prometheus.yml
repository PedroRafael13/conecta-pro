# Prometheus Configuration - ERP Conecta Mais
# =============================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: 'erp-conecta-mais'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Rule files
rule_files:
  - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ERP Backend API health probe (backend não expõe /metrics,
  # usamos blackbox-style probe via node-exporter textfile ou desabilitamos)
  # NOTA: job desabilitado — backend não tem endpoint /metrics
  # Para monitorar uptime, usar health check externo ou blackbox exporter
  # - job_name: 'erp-backend'
  #   static_configs:
  #     - targets: ['172.19.0.1:8080']
  #   metrics_path: /metrics

  # PostgreSQL (via postgres_exporter, mesmo docker network)
  - job_name: 'postgres'
    static_configs:
      - targets: ['erp-postgres-exporter:9187']

  # Redis (via redis_exporter, mesmo docker network)
  - job_name: 'redis'
    static_configs:
      - targets: ['erp-redis-exporter:9121']

  # Node Exporter (mesmo docker network)
  - job_name: 'node'
    static_configs:
      - targets: ['erp-node-exporter:9100']
