# Prometheus Configuration - ERP Conecta Mais
# =============================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: 'erp-conecta-mais'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

# Rule files
rule_files:
  - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ERP Backend API
  - job_name: 'erp-backend'
    scrape_interval: 10s
    static_configs:
      - targets: ['localhost:8080']
    metrics_path: /metrics
    scheme: http

  # PostgreSQL (via postgres_exporter)
  - job_name: 'postgres'
    static_configs:
      - targets: ['localhost:9187']

  # Redis (via redis_exporter)
  - job_name: 'redis'
    static_configs:
      - targets: ['localhost:9121']

  # Node Exporter (metricas do sistema)
  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']
