# Alertas ERP Conecta Mais
# ========================

groups:
  - name: erp_alerts
    interval: 30s
    rules:
      # =====================================================================
      # INFRAESTRUTURA
      # =====================================================================

      # Database exporter down
      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL exporter nao acessivel"
          description: "Exporter do PostgreSQL nao esta respondendo ha mais de 1 minuto."

      # Database connection lost (exporter up but cant connect to PG)
      - alert: PostgresConnectionLost
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL conexao perdida"
          description: "Exporter esta rodando mas nao consegue conectar ao banco. Verificar credenciais e rede."

      # Redis down
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Redis nao acessivel"
          description: "Exporter do Redis nao esta respondendo ha mais de 2 minutos."

      # Disco cheio (< 10%)
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Espaco em disco baixo"
          description: "Menos de 10% de espaco livre no disco ({{ $value | humanizePercentage }})."

      # Disco critico (< 5%)
      - alert: DiskSpaceCritical
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Disco quase cheio"
          description: "Menos de 5% de espaco livre no disco."

      # Memoria alta (> 90%)
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Uso de memoria alto"
          description: "Mais de 90% da memoria esta em uso."

      # Load average alto (> num CPUs * 2)
      - alert: HighLoadAverage
        expr: node_load5 > count(count(node_cpu_seconds_total) by (cpu)) * 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Load average alto"
          description: "Load average de 5 minutos acima do dobro de CPUs disponiveis."

      # =====================================================================
      # SSL / CERTIFICADO
      # =====================================================================

      # SSL expirando em < 30 dias
      - alert: SSLCertExpiringSoon
        expr: ssl_cert_days_remaining < 30
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Certificado SSL expira em {{ $value }} dias"
          description: "O certificado de {{ $labels.domain }} expira em menos de 30 dias. Verificar renovacao automatica."

      # SSL expirando em < 7 dias
      - alert: SSLCertExpiringCritical
        expr: ssl_cert_days_remaining < 7
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "CRITICO: Certificado SSL expira em {{ $value }} dias"
          description: "O certificado de {{ $labels.domain }} expira em menos de 7 dias. Acao imediata necessaria."

      # =====================================================================
      # BACKUP
      # =====================================================================

      # Backup nao rodou nas ultimas 25h
      - alert: BackupStale
        expr: backup_age_seconds > 90000
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "Backup nao executou nas ultimas 25 horas"
          description: "Ultimo backup tem {{ $value | humanizeDuration }} de idade. Verificar cron e script."

      # =====================================================================
      # CELERY / FILA DE TAREFAS
      # =====================================================================

      # Celery queue acumulando (> 100 tasks)
      - alert: CeleryQueueBacklog
        expr: celery_queue_length > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Fila Celery com {{ $value }} tasks acumuladas"
          description: "A fila default do Celery tem mais de 100 tasks. Verificar se workers estao processando."

      # Celery queue critica (> 500 tasks)
      - alert: CeleryQueueCritical
        expr: celery_queue_length > 500
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "CRITICO: Fila Celery com {{ $value }} tasks"
          description: "A fila do Celery esta severamente acumulada. Workers podem estar parados."

      # =====================================================================
      # FRONTEND / PM2
      # =====================================================================

      # PM2 muitos restarts (> 20 em janela recente)
      # Threshold alto para evitar falsos positivos em deploys normais
      - alert: PM2ExcessiveRestarts
        expr: pm2_restart_count > 20
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "PM2 frontend com {{ $value }} restarts"
          description: "O processo PM2 do frontend reiniciou mais de 20 vezes em 15 minutos. Crash loop confirmado."
