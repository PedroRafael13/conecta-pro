# CI Pipeline - ERP Conecta Mais
# Executa em todo push e pull request

name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  POSTGRES_USER: erp_user
  POSTGRES_PASSWORD: test_password
  POSTGRES_DB: erp_test

jobs:
  # ===========================================
  # JOB 1: Linting e Formatação (Backend)
  # ===========================================
  lint:
    name: Backend Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependências
        run: |
          cd backend
          pip install -r requirements.txt
          pip install black isort flake8 mypy

      - name: Black (formatação)
        run: |
          cd backend
          black --check .

      - name: isort (imports)
        run: |
          cd backend
          isort --check-only .

      - name: Flake8 (linting)
        run: |
          cd backend
          flake8 . --max-line-length=100 --ignore=E501,W503

      - name: MyPy (type checking)
        run: |
          cd backend
          mypy core/ api/ --ignore-missing-imports || true

  # ===========================================
  # JOB 2: Linting e Type Check (Frontend)
  # ===========================================
  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Instalar dependências
        run: |
          cd frontend
          npm ci

      - name: ESLint
        run: |
          cd frontend
          npx eslint src/ --max-warnings 0 || true

      - name: TypeScript check
        run: |
          cd frontend
          npx tsc --noEmit || true

  # ===========================================
  # JOB 3: Security Scan
  # ===========================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar dependências
        run: |
          cd backend
          pip install -r requirements.txt
          pip install bandit safety

      - name: Bandit (security scan)
        run: |
          cd backend
          bandit -r core/ api/ -x tests/ -ll || true

      - name: Safety (vulnerabilidades)
        run: |
          cd backend
          safety check -r requirements.txt || true

  # ===========================================
  # JOB 4: Testes (Backend)
  # ===========================================
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [lint]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}

      - name: Instalar dependências
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Rodar testes
        env:
          DATABASE_URL: postgresql+asyncpg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test_secret_key_for_ci_pipeline
          ENVIRONMENT: test
        run: |
          cd backend
          pytest tests/ -v --cov=core --cov=api --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          fail_ci_if_error: false

  # ===========================================
  # JOB 5: Testes (Frontend)
  # ===========================================
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: [frontend-lint]

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Instalar dependências
        run: |
          cd frontend
          npm ci

      - name: Vitest (testes)
        run: |
          cd frontend
          npx vitest run --reporter=verbose || true

      - name: Vitest (coverage)
        run: |
          cd frontend
          npx vitest run --coverage || true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  # ===========================================
  # JOB 6: OWASP ZAP Baseline Scan
  # ===========================================
  owasp-zap:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    needs: [test, frontend-test]

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:8000"
          allow_issue_writing: false
        continue-on-error: true

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html
          retention-days: 7

  # ===========================================
  # JOB 7: Build Docker (apenas main)
  # ===========================================
  build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: [test, security, frontend-test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build imagem
        run: |
          cd backend
          docker build -t erp-conecta-mais:${{ github.sha }} .

      - name: Salvar imagem como artefato
        run: |
          docker save erp-conecta-mais:${{ github.sha }} | gzip > erp-image.tar.gz

      - name: Upload artefato
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: erp-image.tar.gz
          retention-days: 7
