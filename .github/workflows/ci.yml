# CI Pipeline - ERP Conecta Mais
# Executa em todo push e pull request

name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.12"
  POSTGRES_USER: erp_user
  POSTGRES_PASSWORD: test_password
  POSTGRES_DB: erp_test

jobs:
  # ===========================================
  # JOB 1: Linting e Formatação
  # ===========================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependências
        run: |
          cd backend
          pip install -r requirements.txt
          pip install black isort flake8 mypy

      - name: Black (formatação)
        run: |
          cd backend
          black --check .

      - name: isort (imports)
        run: |
          cd backend
          isort --check-only .

      - name: Flake8 (linting)
        run: |
          cd backend
          flake8 . --max-line-length=100 --ignore=E501,W503

      - name: MyPy (type checking)
        run: |
          cd backend
          mypy core/ api/ --ignore-missing-imports || true

  # ===========================================
  # JOB 2: Security Scan
  # ===========================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar dependências
        run: |
          cd backend
          pip install -r requirements.txt
          pip install bandit safety

      - name: Bandit (security scan)
        run: |
          cd backend
          bandit -r core/ api/ -x tests/ -ll || true

      - name: Safety (vulnerabilidades)
        run: |
          cd backend
          safety check -r requirements.txt || true

  # ===========================================
  # JOB 3: Testes
  # ===========================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [lint]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}

      - name: Instalar dependências
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Rodar testes
        env:
          DATABASE_URL: postgresql+asyncpg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test_secret_key_for_ci_pipeline
          ENVIRONMENT: test
        run: |
          cd backend
          pytest tests/ -v --cov=core --cov=api --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          fail_ci_if_error: false

  # ===========================================
  # JOB 4: Build Docker (apenas main)
  # ===========================================
  build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build imagem
        run: |
          cd backend
          docker build -t erp-conecta-mais:${{ github.sha }} .

      - name: Salvar imagem como artefato
        run: |
          docker save erp-conecta-mais:${{ github.sha }} | gzip > erp-image.tar.gz

      - name: Upload artefato
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: erp-image.tar.gz
          retention-days: 7
