# CD Pipeline - Deploy ERP Conecta Mais
# Executa quando há push em main/master com tag

name: Deploy Pipeline

on:
  push:
    tags:
      - 'v*'  # Apenas tags de versão (v1.0.0, v1.0.1, etc.)

env:
  SERVER_HOST: ${{ secrets.SERVER_HOST }}
  SERVER_USER: ${{ secrets.SERVER_USER }}
  DEPLOY_PATH: /opt/erp-conecta-mais

jobs:
  # ===========================================
  # JOB 1: Validar antes do deploy
  # ===========================================
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar testes
        run: |
          cd backend
          pip install -r requirements.txt
          pytest tests/ -v

  # ===========================================
  # JOB 2: Deploy em Staging
  # ===========================================
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: [validate]
    environment: staging

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ env.DEPLOY_PATH }}

            # Backup antes do deploy
            ./scripts/backup_database.sh

            # Pull código
            git fetch --all --tags
            git checkout ${{ github.ref_name }}

            # Atualizar dependências
            cd backend
            source venv/bin/activate
            pip install -r requirements.txt

            # Rodar migrations
            alembic upgrade head

            # Reiniciar serviço (se usando systemd)
            # sudo systemctl restart erp-backend

            echo "Deploy staging concluído: ${{ github.ref_name }}"

      - name: Smoke Tests
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ env.DEPLOY_PATH }}
            source backend/venv/bin/activate
            python scripts/smoke_tests.py http://localhost:8080

  # ===========================================
  # JOB 3: Deploy em Produção (aprovação manual)
  # ===========================================
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    environment: production  # Requer aprovação manual

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Deploy Produção
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            cd ${{ env.DEPLOY_PATH }}

            # Backup CRÍTICO antes do deploy
            ./scripts/backup_database.sh

            # Pull código
            git fetch --all --tags
            git checkout ${{ github.ref_name }}

            # Atualizar dependências
            cd backend
            source venv/bin/activate
            pip install -r requirements.txt

            # Rodar migrations
            alembic upgrade head

            # Reiniciar serviço
            # sudo systemctl restart erp-backend

            echo "Deploy produção concluído: ${{ github.ref_name }}"

      - name: Notificar sucesso
        run: |
          echo "🚀 Deploy v${{ github.ref_name }} em produção realizado com sucesso!"
