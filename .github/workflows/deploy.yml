# CD Pipeline - Deploy ERP Conecta Mais
# Executa quando há push em main/master com tag

name: Deploy Pipeline

on:
  push:
    tags:
      - 'v*'  # Apenas tags de versão (v1.0.0, v1.0.1, etc.)

env:
  SERVER_HOST: ${{ secrets.SERVER_HOST }}
  SERVER_USER: ${{ secrets.SERVER_USER }}
  DEPLOY_PATH: /opt/erp-conecta-mais

jobs:
  # ===========================================
  # JOB 1: Validar antes do deploy
  # ===========================================
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar testes
        run: |
          cd backend
          pip install -r requirements.txt
          pytest tests/ -v

  # ===========================================
  # JOB 2: Deploy em Staging
  # ===========================================
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: [validate]
    environment: staging

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ env.DEPLOY_PATH }}

            # Backup antes do deploy
            ./scripts/backup_database.sh

            # Pull código
            git fetch --all --tags
            git checkout ${{ github.ref_name }}

            # Atualizar dependências
            cd backend
            source venv/bin/activate
            pip install -r requirements.txt

            # Rodar migrations
            alembic upgrade head

            # Reiniciar serviço (se usando systemd)
            # sudo systemctl restart erp-backend

            echo "Deploy staging concluído: ${{ github.ref_name }}"

      - name: Smoke Tests
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ env.DEPLOY_PATH }}
            source backend/venv/bin/activate
            python scripts/smoke_tests.py http://localhost:8080

  # ===========================================
  # JOB 3: Deploy em Produção (aprovação manual)
  # ===========================================
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    environment: production  # Requer aprovação manual

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Deploy Produção
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            cd ${{ env.DEPLOY_PATH }}

            # Backup CRÍTICO antes do deploy
            ./scripts/backup_database.sh

            # Pull código
            git fetch --all --tags
            git checkout ${{ github.ref_name }}

            # Atualizar dependências
            cd backend
            source venv/bin/activate
            pip install -r requirements.txt

            # Rodar migrations
            alembic upgrade head

            # Reiniciar serviço
            # sudo systemctl restart erp-backend

            echo "Deploy produção concluído: ${{ github.ref_name }}"

      - name: Notificar deploy sucesso - Discord
        if: success() && secrets.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          PAYLOAD=$(cat <<EOFPAYLOAD
          {
            "embeds": [{
              "title": "Deploy Production - Sucesso",
              "color": 3066993,
              "fields": [
                {"name": "Versao", "value": "\`${{ github.ref_name }}\`", "inline": true},
                {"name": "Ambiente", "value": "production", "inline": true},
                {"name": "Autor", "value": "${{ github.actor }}", "inline": true},
                {"name": "Timestamp", "value": "${TIMESTAMP}", "inline": false}
              ],
              "footer": {
                "text": "Conecta PRO Deploy"
              },
              "timestamp": "${TIMESTAMP}"
            }]
          }
          EOFPAYLOAD
          )

          curl -s -H "Content-Type: application/json" \
            -d "${PAYLOAD}" \
            "${DISCORD_WEBHOOK}"

          echo "Notificacao de deploy (sucesso) enviada ao Discord."

      - name: Notificar deploy sucesso - Slack
        if: success() && secrets.SLACK_WEBHOOK != ''
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          PAYLOAD=$(cat <<EOFPAYLOAD
          {
            "attachments": [{
              "color": "good",
              "title": ":rocket: Deploy Production - Sucesso",
              "fields": [
                {"title": "Versao", "value": "\`${{ github.ref_name }}\`", "short": true},
                {"title": "Ambiente", "value": "production", "short": true},
                {"title": "Autor", "value": "${{ github.actor }}", "short": true},
                {"title": "Timestamp", "value": "${TIMESTAMP}", "short": true}
              ],
              "footer": "Conecta PRO Deploy",
              "ts": $(date +%s)
            }]
          }
          EOFPAYLOAD
          )

          curl -s -H "Content-Type: application/json" \
            -d "${PAYLOAD}" \
            "${SLACK_WEBHOOK}"

          echo "Notificacao de deploy (sucesso) enviada ao Slack."

      - name: Notificar deploy falha - Discord
        if: failure() && secrets.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          PAYLOAD=$(cat <<EOFPAYLOAD
          {
            "embeds": [{
              "title": "Deploy Production - FALHA",
              "color": 15158332,
              "description": "O deploy da versao ${{ github.ref_name }} em production falhou. Verifique os logs do workflow.",
              "fields": [
                {"name": "Versao", "value": "\`${{ github.ref_name }}\`", "inline": true},
                {"name": "Ambiente", "value": "production", "inline": true},
                {"name": "Autor", "value": "${{ github.actor }}", "inline": true},
                {"name": "Timestamp", "value": "${TIMESTAMP}", "inline": false},
                {"name": "Workflow", "value": "[Ver logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})", "inline": false}
              ],
              "footer": {
                "text": "Conecta PRO Deploy"
              },
              "timestamp": "${TIMESTAMP}"
            }]
          }
          EOFPAYLOAD
          )

          curl -s -H "Content-Type: application/json" \
            -d "${PAYLOAD}" \
            "${DISCORD_WEBHOOK}"

          echo "Notificacao de deploy (falha) enviada ao Discord."

      - name: Notificar deploy falha - Slack
        if: failure() && secrets.SLACK_WEBHOOK != ''
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          PAYLOAD=$(cat <<EOFPAYLOAD
          {
            "attachments": [{
              "color": "danger",
              "title": ":rotating_light: Deploy Production - FALHA",
              "text": "O deploy da versao \`${{ github.ref_name }}\` em production falhou. Verifique os logs do workflow.",
              "fields": [
                {"title": "Versao", "value": "\`${{ github.ref_name }}\`", "short": true},
                {"title": "Ambiente", "value": "production", "short": true},
                {"title": "Autor", "value": "${{ github.actor }}", "short": true},
                {"title": "Timestamp", "value": "${TIMESTAMP}", "short": true},
                {"title": "Workflow", "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Ver logs>", "short": false}
              ],
              "footer": "Conecta PRO Deploy",
              "ts": $(date +%s)
            }]
          }
          EOFPAYLOAD
          )

          curl -s -H "Content-Type: application/json" \
            -d "${PAYLOAD}" \
            "${SLACK_WEBHOOK}"

          echo "Notificacao de deploy (falha) enviada ao Slack."
