name: OpenClaw Quality Monitor

on:
  push:
    branches: [main, develop, feature/*, release/*]
  pull_request:
    branches: [main, develop]
  schedule:
    # Rodar todos os dias as 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      check_group:
        description: 'Grupo de checks a executar (tests, lint, security, audit, all)'
        required: false
        default: 'all'
      parallel:
        description: 'Executar em modo paralelo?'
        required: false
        type: boolean
        default: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  openclaw-checks:
    name: OpenClaw Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        check-group:
          - tests
          - lint
          - security
          - audit

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history para gitleaks

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest pytest-cov bandit pip-audit

      - name: Instalar dependências Node.js
        working-directory: frontend
        run: npm ci

      - name: Instalar ferramentas de segurança
        run: |
          # Gitleaks
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.2_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/
          rm gitleaks_8.18.2_linux_x64.tar.gz

          # Lighthouse CI
          npm install -g @lhci/cli@0.13.x

      - name: Criar diretórios de relatórios
        run: |
          mkdir -p reports/openclaw
          mkdir -p logs/openclaw

      - name: Executar OpenClaw - ${{ matrix.check-group }}
        id: openclaw
        continue-on-error: true
        run: |
          PARALLEL_FLAG=""
          if [ "${{ github.event.inputs.parallel }}" == "true" ] || [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            PARALLEL_FLAG="--parallel"
          fi

          python3 scripts/openclaw/runner.py --only ${{ matrix.check-group }} $PARALLEL_FLAG --output-json
        env:
          CI: true

      - name: Upload relatórios OpenClaw
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-reports-${{ matrix.check-group }}
          path: |
            reports/openclaw/*.json
            logs/openclaw/*.log
          retention-days: 30

      - name: Gerar sumário do check
        if: always()
        run: |
          echo "## OpenClaw - ${{ matrix.check-group }}" >> $GITHUB_STEP_SUMMARY

          # Tentar extrair informações do último relatório JSON
          LATEST_REPORT=$(ls -t reports/openclaw/*.json 2>/dev/null | head -1)

          if [ -f "$LATEST_REPORT" ]; then
            echo "📊 **Relatório:** \`$(basename $LATEST_REPORT)\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Extrair status geral
            STATUS=$(jq -r '.overall_status // "unknown"' "$LATEST_REPORT")
            HEALTH_SCORE=$(jq -r '.health_score // "N/A"' "$LATEST_REPORT")
            DURATION=$(jq -r '.duration_seconds // 0' "$LATEST_REPORT")

            echo "- **Status:** $STATUS" >> $GITHUB_STEP_SUMMARY
            echo "- **Health Score:** $HEALTH_SCORE/100" >> $GITHUB_STEP_SUMMARY
            echo "- **Duração:** ${DURATION}s" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Listar checks
            echo "### Resultados dos Checks" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            jq -r '.checks[] | "- [\(.status | ascii_upcase)] \(.name): \(.message)"' "$LATEST_REPORT" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Nenhum relatório encontrado" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Comentar no PR (se aplicável)
        if: github.event_name == 'pull_request' && matrix.check-group == 'tests'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportFiles = fs.readdirSync('reports/openclaw').filter(f => f.endsWith('.json'));

            if (reportFiles.length === 0) {
              console.log('Nenhum relatório encontrado');
              return;
            }

            const latestReport = reportFiles.sort().reverse()[0];
            const reportPath = `reports/openclaw/${latestReport}`;
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));

            const statusEmoji = {
              pass: '✅',
              fail: '❌',
              warn: '⚠️',
              error: '🔴',
              skip: '⏭️'
            };

            const emoji = statusEmoji[report.overall_status] || '❓';

            // Construir tabela de checks
            const checksTable = report.checks.map(c =>
              `| ${c.name} | ${statusEmoji[c.status] || '?'} ${c.status} | ${c.message} |`
            ).join('\n');

            // Construir comentário
            const comment = [
              `## ${emoji} OpenClaw Quality Report`,
              '',
              `**Status Geral** - ${report.overall_status.toUpperCase()}`,
              `**Health Score** - ${report.health_score}/100`,
              `**Duração** - ${report.duration_seconds}s`,
              '',
              '### Resumo dos Checks',
              '| Check | Status | Mensagem |',
              '|-------|--------|----------|',
              checksTable,
              '',
              '<details>',
              '<summary>📋 Ver detalhes completos</summary>',
              '',
              '```json',
              JSON.stringify(report.summary, null, 2),
              '```',
              '',
              '</details>',
              '',
              '---',
              '🤖 Gerado por OpenClaw Quality Monitor'
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Falhar se check crítico falhou
        if: matrix.check-group == 'security' || matrix.check-group == 'tests'
        run: |
          LATEST_REPORT=$(ls -t reports/openclaw/*.json 2>/dev/null | head -1)

          if [ -f "$LATEST_REPORT" ]; then
            STATUS=$(jq -r '.overall_status' "$LATEST_REPORT")

            if [ "$STATUS" == "fail" ] || [ "$STATUS" == "error" ]; then
              echo "❌ Check crítico ${{ matrix.check-group }} falhou com status: $STATUS"
              exit 1
            fi
          fi

  openclaw-full-cycle:
    name: OpenClaw Full Cycle
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.check_group == 'all'
    timeout-minutes: 45
    needs: [openclaw-checks]

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar todas as dependências
        run: |
          pip install -r backend/requirements.txt
          pip install ruff pytest pytest-cov bandit pip-audit
          cd frontend && npm ci

      - name: Executar ciclo completo OpenClaw
        run: python3 scripts/openclaw/runner.py --parallel --output-json

      - name: Upload relatório completo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-full-cycle-report
          path: reports/openclaw/
          retention-days: 90

      - name: Enviar notificação Discord
        if: failure() && vars.DISCORD_WEBHOOK_OPENCLAW != ''
        run: |
          LATEST_REPORT=$(ls -t reports/openclaw/*.json 2>/dev/null | head -1)

          if [ -f "$LATEST_REPORT" ]; then
            curl -X POST "${{ vars.DISCORD_WEBHOOK_OPENCLAW }}" \
              -H "Content-Type: application/json" \
              -d "{\"content\": \"❌ OpenClaw full cycle falhou no CI/CD\", \"embeds\": [{\"title\": \"Falha no Quality Monitor\", \"color\": 15158332, \"fields\": [{\"name\": \"Workflow\", \"value\": \"${{ github.workflow }}\", \"inline\": true}, {\"name\": \"Branch\", \"value\": \"${{ github.ref_name }}\", \"inline\": true}, {\"name\": \"Commit\", \"value\": \"${{ github.sha }}\", \"inline\": false}]}]}"
          fi
